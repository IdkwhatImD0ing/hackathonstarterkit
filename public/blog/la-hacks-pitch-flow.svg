<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LA Hacks pitch flow</title>
  <desc id="desc">A clean five-step hackathon pitch flow: read the judge, lead clearly, frame the problem, demo the main flow, and protect question time.</desc>
  <defs>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="60%" stop-color="#11131d"/>
      <stop offset="100%" stop-color="#09090f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151824"/>
      <stop offset="100%" stop-color="#10121b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1f2c"/>
      <stop offset="100%" stop-color="#12141e"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99ff00"/>
      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="92" r="210" fill="#99ff00" opacity="0.08"/>
  <circle cx="140" cy="540" r="250" fill="#7c3aed" opacity="0.12"/>

  <rect x="60" y="54" width="1080" height="522" rx="36" fill="url(#panel)" stroke="#2b3142" stroke-width="3" filter="url(#shadow-sm)"/>

  <text x="96" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#99ff00">HACKATHON PLAYBOOK</text>
  <text x="96" y="168" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffffff">A better LA Hacks pitch flow</text>
  <text x="96" y="207" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b8bac7">Make the project easy to understand, remember, and score.</text>

  <line x1="218" y1="335" x2="978" y2="335" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(96 270)">
      <rect width="160" height="130" rx="20" fill="url(#card)" stroke="#99ff00" stroke-opacity="0.56" stroke-width="3"/>
      <circle cx="80" cy="38" r="21" fill="#99ff00" fill-opacity="0.13" stroke="#99ff00" stroke-opacity="0.38" stroke-width="3"/>
      <text x="80" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#99ff00">01</text>
      <text x="80" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Read Judge</text>
      <text x="80" y="110" text-anchor="middle" font-size="14" fill="#9ca3af">Tailor depth</text>
    </g>

    <g transform="translate(300 270)">
      <rect width="160" height="130" rx="20" fill="url(#card)" stroke="#99ff00" stroke-opacity="0.44" stroke-width="3"/>
      <circle cx="80" cy="38" r="21" fill="#99ff00" fill-opacity="0.11" stroke="#99ff00" stroke-opacity="0.32" stroke-width="3"/>
      <text x="80" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#99ff00">02</text>
      <text x="80" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Lead Clearly</text>
      <text x="80" y="110" text-anchor="middle" font-size="14" fill="#9ca3af">Best speaker</text>
    </g>

    <g transform="translate(504 270)">
      <rect width="160" height="130" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.52" stroke-width="3"/>
      <circle cx="80" cy="38" r="21" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="3"/>
      <text x="80" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#38bdf8">03</text>
      <text x="80" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Frame Problem</text>
      <text x="80" y="110" text-anchor="middle" font-size="14" fill="#9ca3af">One sharp slide</text>
    </g>

    <g transform="translate(708 270)">
      <rect width="160" height="130" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.44" stroke-width="3"/>
      <circle cx="80" cy="38" r="21" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="3"/>
      <text x="80" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#38bdf8">04</text>
      <text x="80" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Demo Flow</text>
      <text x="80" y="110" text-anchor="middle" font-size="14" fill="#9ca3af">Main path only</text>
    </g>

    <g transform="translate(912 270)">
      <rect width="192" height="130" rx="20" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="3"/>
      <circle cx="96" cy="38" r="21" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="3"/>
      <text x="96" y="45" text-anchor="middle" font-size="16" font-weight="900" fill="#a78bfa">05</text>
      <text x="96" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Protect Q&amp;A</text>
      <text x="96" y="110" text-anchor="middle" font-size="14" fill="#9ca3af">Video + appendix</text>
    </g>
  </g>

  <rect x="96" y="452" width="1008" height="72" rx="20" fill="#0f111a" stroke="#2b3142" stroke-width="2"/>
  <circle cx="132" cy="488" r="17" fill="#99ff00" fill-opacity="0.13"/>
  <path d="M124 489 L131 496 L143 480" fill="none" stroke="#99ff00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="168" y="485" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#ffffff">If the judge cannot explain it back, the pitch is too broad.</text>
  <text x="168" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9ca3af">Cut extra features, keep the main flow, and save deeper proof for follow-up questions.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1200 630"><title id="title">LA Hacks pitch flow</title><desc id="desc">A clean five-step hackathon pitch flow: read the judge, lead clearly, frame the problem, demo the main flow, and protect question time.</desc><defs><filter id="shadow-sm" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".28" stdDeviation="10"/></filter><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#09090f"/><stop offset="60%" stop-color="#11131d"/><stop offset="100%" stop-color="#09090f"/></linearGradient><linearGradient id="panel" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#151824"/><stop offset="100%" stop-color="#10121b"/></linearGradient><linearGradient id="card" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1b1f2c"/><stop offset="100%" stop-color="#12141e"/></linearGradient><linearGradient id="flow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#9f0"/><stop offset="52%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient><marker id="arrow" markerHeight="14" markerUnits="strokeWidth" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="#38bdf8" d="M2 2 L12 7 L2 12 Z"/></marker></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="1020" cy="92" r="210" fill="#9f0" opacity=".08"/><circle cx="140" cy="540" r="250" fill="#7c3aed" opacity=".12"/><rect width="1080" height="522" x="60" y="54" fill="url(#panel)" stroke="#2b3142" stroke-width="3" filter="url(#shadow-sm)" rx="36"/><text x="96" y="118" fill="#9f0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="4">HACKATHON PLAYBOOK</text><text x="96" y="168" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">A better LA Hacks pitch flow</text><text x="96" y="207" fill="#b8bac7" font-family="Arial, Helvetica, sans-serif" font-size="22">Make the project easy to understand, remember, and score.</text><line x1="218" x2="978" y1="335" y2="335" stroke="url(#flow)" stroke-linecap="round" stroke-width="5" marker-end="url(#arrow)"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(96 270)"><rect width="160" height="130" fill="url(#card)" stroke="#9f0" stroke-opacity=".56" stroke-width="3" rx="20"/><circle cx="80" cy="38" r="21" fill="#9f0" fill-opacity=".13" stroke="#9f0" stroke-opacity=".38" stroke-width="3"/><text x="80" y="45" fill="#9f0" font-size="16" font-weight="900" text-anchor="middle">01</text><text x="80" y="82" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Read Judge</text><text x="80" y="110" fill="#9ca3af" font-size="14" text-anchor="middle">Tailor depth</text></g><g transform="translate(300 270)"><rect width="160" height="130" fill="url(#card)" stroke="#9f0" stroke-opacity=".44" stroke-width="3" rx="20"/><circle cx="80" cy="38" r="21" fill="#9f0" fill-opacity=".11" stroke="#9f0" stroke-opacity=".32" stroke-width="3"/><text x="80" y="45" fill="#9f0" font-size="16" font-weight="900" text-anchor="middle">02</text><text x="80" y="82" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Lead Clearly</text><text x="80" y="110" fill="#9ca3af" font-size="14" text-anchor="middle">Best speaker</text></g><g transform="translate(504 270)"><rect width="160" height="130" fill="url(#card)" stroke="#38bdf8" stroke-opacity=".52" stroke-width="3" rx="20"/><circle cx="80" cy="38" r="21" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".38" stroke-width="3"/><text x="80" y="45" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle">03</text><text x="80" y="82" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Frame Problem</text><text x="80" y="110" fill="#9ca3af" font-size="14" text-anchor="middle">One sharp slide</text></g><g transform="translate(708 270)"><rect width="160" height="130" fill="url(#card)" stroke="#38bdf8" stroke-opacity=".44" stroke-width="3" rx="20"/><circle cx="80" cy="38" r="21" fill="#38bdf8" fill-opacity=".11" stroke="#38bdf8" stroke-opacity=".32" stroke-width="3"/><text x="80" y="45" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle">04</text><text x="80" y="82" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Demo Flow</text><text x="80" y="110" fill="#9ca3af" font-size="14" text-anchor="middle">Main path only</text></g><g transform="translate(912 270)"><rect width="192" height="130" fill="url(#card)" stroke="#a78bfa" stroke-opacity=".58" stroke-width="3" rx="20"/><circle cx="96" cy="38" r="21" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".38" stroke-width="3"/><text x="96" y="45" fill="#a78bfa" font-size="16" font-weight="900" text-anchor="middle">05</text><text x="96" y="82" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Protect Q&amp;A</text><text x="96" y="110" fill="#9ca3af" font-size="14" text-anchor="middle">Video + appendix</text></g></g><rect width="1008" height="72" x="96" y="452" fill="#0f111a" stroke="#2b3142" stroke-width="2" rx="20"/><circle cx="132" cy="488" r="17" fill="#9f0" fill-opacity=".13"/><path fill="none" stroke="#9f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M124 489 L131 496 L143 480"/><text x="168" y="485" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">If the judge cannot explain it back, the pitch is too broad.</text><text x="168" y="510" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="15">Cut extra features, keep the main flow, and save deeper proof for follow-up questions.</text></svg>